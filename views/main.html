<!DOCTYPE html>
<div>
  <div class="spinner-wrapper">
    <div class="spinner">
      <div>
        <i class="fa fa-spinner fa-pulse fa-5x fa-fw"></i>
      </div>
    </div>
  </div>
  <div ng-controller="DesignCtrl">
    <div id="mainpaper" class="paper"></div>
    <div ng-include="'views/menu_submodule.html'"></div>
  </div>
  <div ng-include="'views/menu.html'"></div>
  <div style="display: none">
    <div id="about">
      <div class="row" style="padding: 15px">
        <a
          class="action-open-url-external-browser"
          href="https://github.com/juanmard/icestudio"
        >
          <img
            class="center-block"
            width="300"
            src="images/icestudio-logo-label-nightly.png"
        /></a>
      </div>
      <div class="row">
        <div class="col-sm-12">
          <p>
            Version:
            <a
              class="action-open-url-external-browser"
              href="{{ version_url }}"
              > {{ version_str }}</a
            >
          </p>
          <p>
            License:
            <a
              class="action-open-url-external-browser"
              href="https://www.gnu.org/licenses/old-licenses/gpl-2.0.html"
              >GPL-2.0</a
            >
          </p>
          <p>
            Documentation:
            <a
              class="action-open-url-external-browser"
              href="http://juanmard.github.io/icestudio"
              >juanmard.github.io/icestudio</a
            >
          </p>
          <p>
            Wiki:
            <a
              class="action-open-url-external-browser"
              href="https://github.com/juanmard/icestudio/wiki"
              >github.com/juanmard/icestudio/wiki</a
            >
          </p>
        </div>
      </div>
      <div class="row" style="margin-top: 15px">
        <div class="col-sm-12">
          <p>
            Thanks to all the
            <a
              class="action-open-url-external-browser"
              href="https://github.com/juanmard/icestudio/contributors"
              >contributors</a
            >
            <i id="heart" class="fa fa-fw fa-heart"></i>
          </p>
        </div>
      </div>
      <div class="row" style="padding-top: 15px">
        <a
          class="action-open-url-external-browser"
          href="https://groups.google.com/g/fpga-wars-explorando-el-lado-libre"
        >
          <img class="center-block" width="475" src="images/fpgawars.png"
        /></a>
      </div>
    </div>
  </div>
</div>
