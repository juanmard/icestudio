<!DOCTYPE html>
<script type="text/ng-template" id="views/accordion-group.html">
  <div class="panel" ng-class="panelClass || 'panel-default'">
    <div
      role="tab"
      id="{{::headingId}}"
      aria-selected="{{isOpen}}"
      class="panel-heading"
      ng-keypress="toggleOpen($event)"
    >
      <a role="button"
        data-toggle="collapse"
        href aria-expanded="{{isOpen}}"
        aria-controls="{{::panelId}}"
        tabindex="0"
        class="accordion-toggle"
        uib-accordion-transclude="heading"
      ><span uib-accordion-header ng-class="{'text-muted': isDisabled}">{{$scope}}{{heading}}</span></a>
    </div>
    <div
      id="{{::panelId}}"
      aria-labelledby="{{::headingId}}"
      aria-hidden="{{!isOpen}}"
      role="tabpanel"
      class="panel-collapse collapse"
      uib-collapse="!isOpen"
    >
      <div class="panel-body" ng-transclude></div>
    </div>
  </div>
</script>

<div class="modal-body" id="modal-body">
  <h4 class="modal-title" id="modal-title">
    <i class="fa fa-fw fa-gears"></i> Preferences
    <span class="pull-right" role="button"
      ><i class="fa fa-fw fa-close" ng-click="done()" type="button"></i
    ></span>
  </h4>
  <uib-accordion close-others="false">
    <div
      uib-accordion-group
      class="panel-default"
      ng-repeat="(key, val) in tabs"
      is-disabled="val.disabled"
      is-open="val.isopen"
      template-url="views/accordion-group.html"
    >
      <uib-accordion-heading>
        <span ng-if="!val.headonly" ng-click="val.isopen = !val.isopen">
          <i
            class="fa fa-fw"
            ng-class="{'fa-caret-right': !val.isopen, 'fa-caret-down': val.isopen}"
            style="padding-top: 4px"
          ></i
          ><i class="fa fa-fw fa-{{val.icon}}"></i> {{ val.title | translate }}
        </span>
        <span ng-if="val.headonly" style="cursor: default">
          <i class="fa fa-fw"></i><i class="fa fa-fw fa-{{val.icon}}"></i> {{
          val.title | translate }}
        </span>
        <span ng-if="val.disabled" class="pull-right"
          ><i class="fa fa-fw fa-ban" style="padding-top: 1px"></i>
        </span>
        <span
          ng-if="!val.disabled"
          ng-include="'views/pref_head_'+ key +'.html'"
        ></span>
      </uib-accordion-heading>
      <div ng-if="!val.headonly" ng-include="'views/pref_'+ key +'.html'"></div>
    </div>
  </uib-accordion>
</div>

<script type="text/ng-template" id="views/pref_head_collections.html">
  <span class="pull-right">
    <div class="btn-toolbar" role="toolbar" style="display:inline-block;">

      <div
        class="btn-group btn-group-xs"
        role="group"
      >
        <button
          type="button"
          class="btn btn-default"
          ng-click="addCollections()"
          uib-tooltip="{{ 'Add collection(s)...' | translate }}"
          tooltip-append-to-body="true"
        ><i class="fa fa-fw fa-plus" aria-hidden="true"></i
          ></button>
      </div>

      <div
        class="btn-group btn-group-xs"
        role="group"
      >
        <button
          type="button"
          class="btn btn-default"
          ng-click="reloadCollections()"
          uib-tooltip="{{ 'Reload all collections' |
        translate }}"
          tooltip-append-to-body="true"
        ><i class="fa fa-fw fa-refresh" aria-hidden="true"></i
          ></button>
          <span
          class="btn btn-default no-btn disabled"
          uib-tooltip="{{ 'Installed collections' | translate }}"
          tooltip-append-to-body="true"
        >{{common.internalCollections.length}} + {{common.externalCollections.length}}</span>

        <button
          type="button"
          class="btn btn-danger"
          ng-click="removeAllCollections()"
          uib-tooltip="{{ 'Remove all collection' | translate }}"
          tooltip-append-to-body="true"
        ><i class="fa fa-fw fa-remove" aria-hidden="true"></i
          ></button>

      </div>

      <div class="btn-group btn-group-xs" role="group">
      <span
      class="btn btn-default disabled no-btn no-btn-200"
      uib-tooltip="{{ 'External collections path' | translate }}"
      tooltip-append-to-body="true"
      ng-class="{'italic': !externalPath}" >{{ externalPath || 'unset' }}</span>
        <button
          type="button"
          class="btn btn-default"
          ng-click="setExternalCollections()"
          uib-tooltip="{{ 'Set external collections path' | translate }}"
          tooltip-append-to-body="true"
        ><i
          class="fa fa-fw"
          aria-hidden="true"
          ng-class="'fa-' + (externalPath?'external-link':'pencil')"></i
          ></button>
      </div>

    </div>
  </span>
</script>

<script type="text/ng-template" id="views/pref_head_plugins.html">
  <span class="pull-right">
    <div class="btn-group btn-group-xs" role="group">
      <span
      class="btn btn-default disabled no-btn no-btn-200"
      uib-tooltip="{{ 'External plugin path' | translate }}"
      tooltip-append-to-body="true"
    ><span ng-class="{'italic': !common.data.externalPlugins}">{{ common.data.externalPlugins || 'unset' }}</span>
    </span>
        <button
          type="button"
          class="btn btn-default"
          ng-click="setExternalPlugins()"
          uib-tooltip="{{ 'Set external plugin path' | translate }}"
          tooltip-append-to-body="true"
        ><i
          class="fa fa-fw"
          aria-hidden="true"
          ng-class="'fa-' + (common.data.externalPlugins?'check':'pencil')"></i
          ></button>
      </div>
  </span>
</script>

<script type="text/ng-template" id="views/pref_head_language.html">
  <span class="pull-right" ng-click="val.isopen = !val.isopen">
    {{ languages[common.data.language] }} <span class="badge" style="margin-left: 5px; min-width: 50px">{{common.data.language | translate}}</span>
  </span>
</script>

<script type="text/ng-template" id="views/pref_language.html">
  <div class="list-group">
    <button type="button"
      class="list-group-item"
      ng-repeat="(key, val) in languages"
      ng-click="selectLanguage(key)"
      ng-class="{'active': common.data.language == key}"
    ><i
    class="fa fa-fw"
    ng-class="'fa-'+(common.data.language == key?'check-':'')+'square-o'"
    aria-hidden="true"
  ></i> {{ val | translate }} <span class="badge" style="min-width: 50px">{{key}}</span></button>
  </div>
</script>

<script type="text/ng-template" id="views/pref_head_theme.html">
  <span class="pull-right" ng-click="val.isopen = !val.isopen">
    <div ng-repeat="theme in themes">
      <span ng-if="common.data.uiTheme == theme[0]">
      {{theme[1] | translate}}</span>
    </div>
  </span>
</script>

<script type="text/ng-template" id="views/pref_theme.html">

      <div class="list-group">
        <button
          type="button"
          class="list-group-item"
          ng-click="selectTheme(theme[0])"
          ng-repeat="theme in themes"
        >
        <span class="fa fa-fw"
           ng-class="'fa-'+(common.data.uiTheme == theme[0]?'check-':'')+'square-o'"
           aria-hidden="true"></span>
           {{ theme[1] | translate }} <span class="badge" style="min-width: 150px">{{theme[0] + '.css'}}</span>
      </button>
      </div>

  <!-- TODO: use 'uib-btn-radio'; needs reworking common.data.uiTheme
    <span class="pull-left">
      <div class="btn-group">
        <label
          class="btn btn-xs btn-default"
          ng-model="common.data.uiTheme"
          uib-btn-radio="theme[0]"
          uib-btn-checkbox
          ng-click="selectTheme(theme[0])"
          ng-repeat="theme in themes"
        >{{ theme[1] | translate }}</label>
      </div>
    </span>
  -->
</script>

<script type="text/ng-template" id="views/pref_head_toolchain.html">
  <span class="pull-right">

    <div class="btn-toolbar" role="toolbar" aria-label="...">

      <div class="btn-group btn-group-xs" role="group">
        <span
          class="btn btn-default disabled no-btn no-btn-100"
          uib-tooltip="{{ 'Installed apio version' | translate }}"
          tooltip-append-to-body="true"
        ><span >{{ 'apio ' + toolchain.apio }}</span>
        </span>

          <button
            type="button"
            class="btn btn-default"
            ng-click="tools.checkToolchain()"
            uib-tooltip="{{ 'Check available toolchain' | translate }}"
            tooltip-append-to-body="true"
          ><i
            class="fa fa-fw"
            ng-class="'fa-' + (toolchain.apio!='-'?'check':'question')"
            aria-hidden="true"></i
            ></button>
        </div>

      <div class="btn-group btn-group-xs" role="group">
        <span
          class="btn btn-default disabled no-btn no-btn-150"
          uib-tooltip="{{ 'Source repository' | translate }}"
          tooltip-append-to-body="true"
        ><span >{{ common.data.apioRepo }}</span>
        </span>

        <span
          class="btn btn-default disabled no-btn no-btn-100"
          uib-tooltip="{{ 'Reference (branch or tag)' | translate }}"
          tooltip-append-to-body="true"
        ><span>{{ common.data.apioRef }}</span>
        </span>

          <button
            type="button"
            class="btn btn-default"
            ng-click="setApioRepo()"
            uib-tooltip="{{ 'Set apio repository or reference' | translate }}"
            tooltip-append-to-body="true"
          ><i
            class="fa fa-fw fa-pencil"
            aria-hidden="true"></i
            ></button>
        </div>

      <div
      class="btn-group btn-group-xs"
      role="group"
    >

    <button
      type="button"
      class="btn btn-default"
      ng-click="tools.installToolchain()"
    >{{ (toolchain.apio != '-' ? 'Update' : 'Install') | translate }}</button>

    <button
      type="button"
      class="btn btn-default"
      ng-click="tools.removeToolchain()"
      ng-class="{'is-disabled': toolchain.apio === '-'}"
    >{{ 'Remove' | translate }}</button>

    </div>

  </div>
  </span>
</script>

<script type="text/ng-template" id="views/pref_toolchain.html">

    <ul class="list-group list-group-flush">

      <li class="list-group-item">
        <span><i class="fa fa-fw fa-terminal" aria-hidden="true"></i> {{ 'Custom Python environment' | translate }}&nbsp;</span>
        <div class="btn-group btn-group-xs" role="group">
          <span
          class="btn btn-default disabled no-btn no-btn-150"
          uib-tooltip="{{ 'Custom Python executable' | translate }}"
          tooltip-append-to-body="true"
        ><span ng-class="{'italic': !common.data.pythonEnv}">{{ common.data.pythonEnv || 'unset' }}</span>
        </span>
            <button
              type="button"
              class="btn btn-default"
              ng-click="setPythonEnv()"
              uib-tooltip="{{ 'Set Python environment' | translate }}"
              tooltip-append-to-body="true"
            ><i
              class="fa fa-fw fa-pencil"
              aria-hidden="true"></i
              ></button>
          </div>

        <div
        class="btn-group btn-group-xs"
        role="group"
      >
      <span>(default: {{ tools.PythonExecutable || 'not found' }})</span>
      </li>

      <li class="list-group-item">
        <span><i class="fa fa-fw fa-rocket" aria-hidden="true"></i> {{ 'Drivers' | translate }}&nbsp;</span>
    <div class="btn-group btn-group-xs" role="group" aria-label="...">
      <button
        type="button"
        class="btn btn-default"
        ng-click="tools.enableDrivers()">
        {{ 'Enable' | translate }}
      </button>

      <button
        type="button"
        class="btn btn-default"
        ng-click="tools.disableDrivers()">
        {{ 'Disable' | translate }}
      </button>
    </div>
  </li>

  </ul>
</script>
