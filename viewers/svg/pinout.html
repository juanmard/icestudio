<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="lib/svg-pan-zoom.js"></script>
    <style type="text/css">
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <embed id="pinout" width="100%" height="100%" type="image/svg+xml" />
    <script>
      'use strict';

      window.onload = function () {
        function getURLParameter(name) {
          return (
            decodeURIComponent(
              (new RegExp('[?|&]' + name + '=' + '([^&;]+?)(&|#|;|$)').exec(
                location.search
              ) || [null, ''])[1].replace(/\+/g, '%20')
            ) || null
          );
        }
        var elem = document.getElementById('pinout');
        elem.setAttribute(
          'src',
          `../../resources/boards/${getURLParameter('board')}/pinout.svg`
        );
        setTimeout(function () {
          svgPanZoom(elem, {
            controlIconsEnabled: true,
            minZoom: 1,
            maxZoom: 5,
          });
        }, 50);
      };
    </script>
  </body>
</html>
